name: Build and Push TeX Live Image

on:
  workflow_dispatch:
  schedule:
    # 毎月1日 00:00 UTC
    - cron: "0 0 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/texlive-image

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image tag
        run: echo "IMAGE_TAG=$(date +%Y)" >> $GITHUB_ENV

      - name: Build image
        run: |
          docker build --pull --no-cache -t texlive-image:test .
          df -h

      - name: Test latexmk / pdflatex
        run: |
          docker run --rm texlive-image:test latexmk --version
          docker run --rm texlive-image:test pdflatex --version

      - name: Compile test document
        run: |
          mkdir testdoc
          cat > testdoc/main.tex <<'EOF'
          \documentclass{article}
          \begin{document}
          Hello, TeX Live!
          \end{document}
          EOF
          docker run --rm -v "$PWD/testdoc:/work" -w /work \
            texlive-image:test latexmk -pdf main.tex
          test -f testdoc/main.pdf

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          for tag in latest "$IMAGE_TAG"; do
            docker tag texlive-image:test "$IMAGE_NAME:$tag"
            docker push "$IMAGE_NAME:$tag"
          done
